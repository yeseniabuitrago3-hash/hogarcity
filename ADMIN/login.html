<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HogarCity - Acceso Administrador</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --primary-dark: #0a1e3d;
            --primary: #1a3a6b;
            --primary-mid: #2c5aa0;
            --primary-light: #4a8ad4;
            --primary-lightest: #e6f0fa;
            --white: #ffffff;
            --white-smoke: #f8fafc;
            --gray-light: #eef2f7;
            --gray-mid: #94a3b8;
            --gray-dark: #475569;
            --gray-darkest: #1e293b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gradient-primary: linear-gradient(135deg, #1a3a6b 0%, #2c5aa0 100%);
            --shadow-sm: 0 2px 8px rgba(26,58,107,0.06);
            --shadow-md: 0 8px 24px rgba(26,58,107,0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--white-smoke);
            color: var(--gray-darkest);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(10,30,61,0.15);
            text-align: center;
        }

        .login-logo {
            margin-bottom: 32px;
        }

        .login-logo .logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .login-logo h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
        }

        .login-logo p {
            color: var(--gray-mid);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--gray-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--gray-light);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: var(--white);
            color: var(--gray-darkest);
        }

        .form-group input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(74,138,212,0.12);
            outline: none;
        }

        .login-error {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: var(--radius-sm);
            color: #991b1b;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .login-error.show {
            display: flex;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--gradient-primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(26,58,107,0.35);
        }

        .login-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--gray-light);
            font-size: 13px;
            color: var(--gray-mid);
        }

        .btn-back {
            display: inline-block;
            margin-top: 12px;
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-back:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }
            .login-logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <span class="logo-icon">🔐</span>
            <h1>Acceso Administrador</h1>
            <p>Ingresa tus credenciales para acceder al panel de control</p>
        </div>

        <div class="login-error" id="loginError">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorMessage">Credenciales incorrectas</span>
        </div>

               <form id="loginForm">
            <div class="form-group">
                <label for="emailInput">Correo Electrónico</label>
                <input type="email" id="emailInput" placeholder="admin@hogarcity.com" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="passwordInput">Contraseña</label>
                <div style="position: relative;">
                    <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" required style="padding-right: 48px;">
                    <button type="button" id="togglePassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--gray-mid); font-size: 18px; padding: 4px 8px;">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <i class="fas fa-sign-in-alt"></i> Ingresar
            </button>
        </form>



        <div class="login-footer">
            <p>Sistema Operativo v1.0.0</p>
            <a href="../EMPLEADO/dashboard.html" class="btn-back">← Volver al Panel</a>
        </div>
    </div>

       <script type="module">
    // ============================================
    // CONEXIÓN A SUPABASE
    // ============================================
    import { supabase } from '/js/supabase.js';

    // ============================================
    // DOM ELEMENTS
    // ============================================
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const errorMessage = document.getElementById('errorMessage');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const togglePassword = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const btnLogin = document.getElementById('btnLogin');

    // ============================================
    // MOSTRAR/OCULTAR CONTRASEÑA ("OJITO")
    // ============================================
    togglePassword.addEventListener('click', function() {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    });

    // ============================================
    // LOGIN
    // ============================================
    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value.trim();

        if (!email || !password) {
            loginError.classList.add('show');
            errorMessage.textContent = '❌ Debes completar todos los campos';
            return;
        }

        // Deshabilitar botón mientras se procesa
        btnLogin.disabled = true;
        btnLogin.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';

        try {
            // 🔥 Buscar el empleado por email
            const { data: empleados, error: errEmp } = await supabase
                .from('empleados')
                .select('id, nombre_completo, email, password_hash, rol, activo')
                .eq('email', email)
                .eq('activo', true)
                .limit(1);

            if (errEmp) {
                console.error('Error en login:', errEmp);
                throw new Error('Error al conectar con la base de datos');
            }

            // Verificar si el empleado existe
            if (!empleados || empleados.length === 0) {
                throw new Error('Usuario no encontrado');
            }

            const empleado = empleados[0];

            // 🔥 Verificar que sea admin
            if (empleado.rol !== 'admin') {
                throw new Error('No tienes permisos de administrador');
            }

            // 🔥 Verificar contraseña
            // ⚠️ NOTA: Esto es temporal. En producción usa Supabase Auth.
            if (empleado.password_hash !== password) {
                throw new Error('Contraseña incorrecta');
            }

            // ✅ Login exitoso
            console.log('✅ Login exitoso:', empleado.nombre_completo);

            // Guardar sesión en sessionStorage (más seguro que localStorage)
            sessionStorage.setItem('hogarcity_admin_session', 'true');
            sessionStorage.setItem('hogarcity_admin_user', JSON.stringify({
                id: empleado.id,
                nombre: empleado.nombre_completo,
                email: empleado.email,
                rol: empleado.rol
            }));

            // Redirigir al dashboard
            window.location.href = 'admin.html';

        } catch (error) {
            loginError.classList.add('show');
            errorMessage.textContent = '❌ ' + error.message;
            
            setTimeout(() => {
                loginError.classList.remove('show');
            }, 4000);
        } finally {
            // Restaurar botón
            btnLogin.disabled = false;
            btnLogin.innerHTML = '<i class="fas fa-sign-in-alt"></i> Ingresar';
        }
    });

  // ============================================
// SI YA HAY SESIÓN ACTIVA, REDIRIGIR
// (Comentado para evitar bucle si admin.html usa localStorage)
// ============================================
// if (sessionStorage.getItem('hogarcity_admin_session') === 'true') {
//     window.location.href = 'admin.html';
// }

    console.log('🔐 Login de administrador listo.');
    </script>
</body>
</html>
